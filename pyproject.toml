[project]
name = "gmv-qaoa"
version = "1.0.0"
description = "Numerical reproduction of simulated QAOA for GMV fruit-fly surveillance prioritisation"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "geopandas==1.1.4",
    "numpy==2.5.1",
    "pandas==2.3.3",
    "pypdf==6.14.2",
    "qiskit==2.5.1",
    "scipy==1.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmv_qaoa"]

[tool.uv]
cache-dir = ".cache/uv"
